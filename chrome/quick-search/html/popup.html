<html>

<head>
  <title>QuickSearch Settings</title>
  <style>
    @media (prefers-color-scheme: light) {
      body {
        background: #FFF;
        color: #333;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #333;
        color: #FFF;
      }
    }

    body {
      min-width: 300px;
      font-size: 15px;
    }

    span {
      display: flex;
      align-items: center;
    }

    input {
      margin-left: 5px;
      outline: none;
    }

    label {
      display: flex;
      align-items: center;
    }

    .icon {
      width: 32px;
      height: 32px;
      transform: scale(.5);
    }

    .icon-bing {
      background: url('../images/icons.png') no-repeat -62px -10px;
    }

    .icon-google {
      background: url('../images/icons.png') no-repeat -10px -62px;
    }

    .icon-duckduckgo {
      background: url('../images/icons.png') no-repeat -114px -10px;
    }
  </style>
</head>

<body>
  <div class="content">
    <h2>QuickSearch Settings</h2>
    <p>Please select your default search engine:</p>
    <div id="search_engine_options">
      <script src="../js/options.js" type="module"></script>
    </div>
</body>

</html>
